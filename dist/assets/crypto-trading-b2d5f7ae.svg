<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a1a"/>
  
  <!-- Abstract network pattern -->
  <g opacity="0.6">
    <!-- Interconnected nodes -->
    <circle cx="100" cy="100" r="8" fill="url(#grad1)" opacity="0.8"/>
    <circle cx="200" cy="80" r="6" fill="url(#grad2)" opacity="0.7"/>
    <circle cx="300" cy="120" r="8" fill="url(#grad1)" opacity="0.8"/>
    <circle cx="150" cy="180" r="6" fill="url(#grad2)" opacity="0.7"/>
    <circle cx="250" cy="200" r="8" fill="url(#grad1)" opacity="0.8"/>
    <circle cx="350" cy="160" r="6" fill="url(#grad2)" opacity="0.7"/>
    
    <!-- Connection lines -->
    <line x1="100" y1="100" x2="200" y2="80" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
    <line x1="200" y1="80" x2="300" y2="120" stroke="url(#grad2)" stroke-width="2" opacity="0.6"/>
    <line x1="100" y1="100" x2="150" y2="180" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
    <line x1="150" y1="180" x2="250" y2="200" stroke="url(#grad2)" stroke-width="2" opacity="0.6"/>
    <line x1="250" y1="200" x2="350" y2="160" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
    <line x1="300" y1="120" x2="350" y2="160" stroke="url(#grad2)" stroke-width="2" opacity="0.6"/>
    
    <!-- Additional small nodes -->
    <circle cx="120" cy="140" r="3" fill="#3b82f6" opacity="0.5"/>
    <circle cx="180" cy="150" r="3" fill="#8b5cf6" opacity="0.5"/>
    <circle cx="220" cy="110" r="3" fill="#3b82f6" opacity="0.5"/>
    <circle cx="280" cy="170" r="3" fill="#8b5cf6" opacity="0.5"/>
  </g>
  
  <!-- Data visualization elements -->
  <g opacity="0.4">
    <rect x="50" y="220" width="80" height="4" fill="#3b82f6"/>
    <rect x="150" y="230" width="60" height="4" fill="#8b5cf6"/>
    <rect x="230" y="240" width="100" height="4" fill="#3b82f6"/>
    <rect x="350" y="250" width="40" height="4" fill="#8b5cf6"/>
  </g>
</svg>
