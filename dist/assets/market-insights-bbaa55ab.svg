<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.4" />
    </radialGradient>
    <radialGradient id="grad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Abstract circular pattern -->
  <g opacity="0.6">
    <!-- Main circles -->
    <circle cx="200" cy="150" r="80" fill="url(#grad1)" opacity="0.3"/>
    <circle cx="200" cy="150" r="50" fill="url(#grad2)" opacity="0.4"/>
    <circle cx="200" cy="150" r="25" fill="#10b981" opacity="0.6"/>
    
    <!-- Orbiting elements -->
    <circle cx="120" cy="100" r="15" fill="#06b6d4" opacity="0.5"/>
    <circle cx="280" cy="100" r="12" fill="#10b981" opacity="0.5"/>
    <circle cx="120" cy="200" r="12" fill="#06b6d4" opacity="0.5"/>
    <circle cx="280" cy="200" r="15" fill="#10b981" opacity="0.5"/>
    
    <!-- Connection lines -->
    <line x1="200" y1="150" x2="120" y2="100" stroke="#10b981" stroke-width="1" opacity="0.3"/>
    <line x1="200" y1="150" x2="280" y2="100" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
    <line x1="200" y1="150" x2="120" y2="200" stroke="#10b981" stroke-width="1" opacity="0.3"/>
    <line x1="200" y1="150" x2="280" y2="200" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Data points -->
  <g opacity="0.4">
    <circle cx="80" cy="80" r="3" fill="#10b981"/>
    <circle cx="320" cy="80" r="3" fill="#06b6d4"/>
    <circle cx="80" cy="220" r="3" fill="#06b6d4"/>
    <circle cx="320" cy="220" r="3" fill="#10b981"/>
    <circle cx="200" cy="50" r="3" fill="#10b981"/>
    <circle cx="200" cy="250" r="3" fill="#06b6d4"/>
  </g>
</svg>
