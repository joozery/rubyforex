<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a1a"/>
  
  <!-- Abstract neural network pattern -->
  <g opacity="0.6">
    <!-- Main curves -->
    <path d="M50 150 Q150 50 250 150 T400 100" stroke="url(#grad1)" stroke-width="3" fill="none"/>
    <path d="M50 200 Q150 100 250 200 T400 150" stroke="url(#grad2)" stroke-width="2" fill="none"/>
    <path d="M50 100 Q150 200 250 100 T400 200" stroke="url(#grad1)" stroke-width="2" fill="none"/>
    
    <!-- Connection dots -->
    <circle cx="100" cy="120" r="4" fill="#ef4444" opacity="0.8"/>
    <circle cx="150" cy="80" r="3" fill="#f97316" opacity="0.7"/>
    <circle cx="200" cy="180" r="4" fill="#ef4444" opacity="0.8"/>
    <circle cx="250" cy="140" r="3" fill="#f97316" opacity="0.7"/>
    <circle cx="300" cy="90" r="4" fill="#ef4444" opacity="0.8"/>
    <circle cx="350" cy="160" r="3" fill="#f97316" opacity="0.7"/>
    
    <!-- Data flow lines -->
    <line x1="100" y1="120" x2="150" y2="80" stroke="#ef4444" stroke-width="1" opacity="0.5"/>
    <line x1="150" y1="80" x2="200" y2="180" stroke="#f97316" stroke-width="1" opacity="0.5"/>
    <line x1="200" y1="180" x2="250" y2="140" stroke="#ef4444" stroke-width="1" opacity="0.5"/>
    <line x1="250" y1="140" x2="300" y2="90" stroke="#f97316" stroke-width="1" opacity="0.5"/>
    <line x1="300" y1="90" x2="350" y2="160" stroke="#ef4444" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Chart-like elements -->
  <g opacity="0.4">
    <rect x="50" y="220" width="300" height="2" fill="#ef4444"/>
    <rect x="50" y="240" width="200" height="2" fill="#f97316"/>
    <rect x="50" y="260" width="250" height="2" fill="#ef4444"/>
  </g>
</svg>
