<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#f97316;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a1a"/>
  
  <!-- Abstract wave pattern -->
  <g opacity="0.7">
    <!-- Main wave -->
    <path d="M0 150 Q100 50 200 150 T400 100" stroke="url(#grad1)" stroke-width="4" fill="none"/>
    <path d="M0 180 Q100 130 200 180 T400 140" stroke="url(#grad1)" stroke-width="3" fill="none"/>
    <path d="M0 120 Q100 70 200 120 T400 80" stroke="url(#grad1)" stroke-width="2" fill="none"/>
    
    <!-- Glowing effect -->
    <path d="M0 150 Q100 50 200 150 T400 100" stroke="url(#grad1)" stroke-width="8" fill="none" opacity="0.3"/>
  </g>
  
  <!-- Floating elements -->
  <g opacity="0.6">
    <circle cx="100" cy="100" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="200" cy="80" r="4" fill="#f97316" opacity="0.7"/>
    <circle cx="300" cy="120" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="150" cy="200" r="4" fill="#f97316" opacity="0.7"/>
    <circle cx="250" cy="180" r="6" fill="#ef4444" opacity="0.8"/>
  </g>
  
  <!-- Data visualization -->
  <g opacity="0.5">
    <rect x="50" y="220" width="300" height="3" fill="#ef4444"/>
    <rect x="50" y="240" width="200" height="3" fill="#f97316"/>
    <rect x="50" y="260" width="250" height="3" fill="#ef4444"/>
  </g>
</svg>
